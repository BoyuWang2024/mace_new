profile: smoke_test

checkpoint:
  path: ../../../data/checkpoint/MACE-matpes-r2scan-omat-ft.model
  expected_sha256: 8f147ecffa1d06a696e5648b13b81abda9c96fda9d0fb3faba3cd3fb27d9bba9
  feature_modules:
    - name: products.0
      expected_dim: 512
    - name: products.1
      expected_dim: 128

data:
  train:
    path: ../../../data/dataset/matpes_n20.extxyz
    expected_sha256: c92161329aab539064a2c2438a395cb01e38bfc91211c558aebbc1ff94702e3d
  validation:
    path: ../../../data/dataset/matpes_n20.extxyz
    expected_sha256: c92161329aab539064a2c2438a395cb01e38bfc91211c558aebbc1ff94702e3d
  test:
    path: ../../../data/dataset/matpes_n20.extxyz
    expected_sha256: c92161329aab539064a2c2438a395cb01e38bfc91211c558aebbc1ff94702e3d

cache:
  build_batch_size: 2
  shard_max_atoms: 1000
  num_workers: 0
  pin_memory: false
  resume: true

binning:
  algorithm: fixed_linear_v1
  force:
    num_bins: 50
    max_error: 0.3
  energy:
    num_bins: 50
    max_error: 0.5

model:
  force:
    target_mode: atom_mean
    hidden_dims: [256, 256, 256]
    dropout: 0.05
  energy:
    cumulant_order: 3
    projection_dim: 512
    adapter_dropout: 0.1
    hidden_dims: [256, 256]
    dropout: 0.2
    signed_root: true

loss:
  force_coefficient: 1.0
  energy_coefficient: 0.3

optimizer:
  name: adamw
  learning_rate: 0.001
  weight_decay: 0.0001

trainer:
  batch_size: 2
  max_epochs: 3
  early_stopping_patience: 3
  resume: true

runtime:
  seed: 1234
  device: cpu
  deterministic: true

logging:
  jsonl: true
  wandb: true
  wandb_project: mace-confidence-head
  wandb_mode: offline

run:
  name_prefix: mace_matpes_n20
  output_root: ../outputs
